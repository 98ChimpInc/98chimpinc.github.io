document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

color: var(--live-tint);\n}\n\nh1,\nh2,\nh3 {\n  margin: 0;\n  font-family: var(--font-display);\n  text-wrap: balance;\n}\n\np {\n  margin: 0;\n}\n\np,\nli,\ndt,\ndd {\n  text-wrap: pretty;\n}\n\nbutton {\n  font: inherit;\n}\n\n:focus-visible {\n  outline: 2px solid var(--live);\n  outline-offset: 3px;\n}\n\n.visually-hidden {\n  position: absolute !important;\n  width: 1px;\n  height: 1px;\n  margin: -1px;\n  padding: 0;\n  border: 0;\n  overflow: hidden;\n  clip: rect(0 0 0 0);\n  clip-path: inset(50%);\n  white-space: nowrap;\n}\n\n/* Page frame */\n\n.page {\n  display: grid;\n  gap: 28px;\n  max-width: 1180px;\n  margin-inline: auto;\n  padding: 28px 16px 40px;\n}\n\n@media (min-width: 720px) {\n  .page {\n    gap: 36px;\n    padding: 44px 32px 56px;\n  }\n}\n\n.masthead {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: flex-end;\n  justify-content: space-between;\n  gap: 20px 32px;\n  padding-bottom: 24px;\n  border-bottom: 1px solid var(--rule);\n}\n\n.masthead-copy {\n  display: grid;\n  gap: 10px;\n  min-width: 0;\n  max-width: 44rem;\n}\n\n.kicker,\n.eyebrow {\n  font-family: var(--font-display);\n  font-size: 0.78rem;\n  font-weight: 600;\n  line-height: 1.3;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--live);\n}\n\nh1 {\n  font-size: clamp(2.3rem, 1.6rem + 3.4vw, 4rem);\n  font-weight: 800;\n  line-height: 0.98;\n  letter-spacing: 0.01em;\n  text-transform: uppercase;\n}\n\n.lede {\n  max-width: 40rem;\n  font-size: 1.12em;\n  color: var(--ink-soft);\n}\n\n/* Technical detail switch */\n\n.switch {\n  display: inline-flex;\n  align-items: center;\n  gap: 0.65rem;\n  padding: 0.45rem 0.95rem 0.45rem 0.5rem;\n  border: 1px solid var(--rule-strong);\n  border-radius: 999px;\n  background: transparent;\n  color: var(--ink);\n  font-weight: 600;\n  font-size: 0.92rem;\n  line-height: 1.2;\n  cursor: pointer;\n}\n\n.switch:hover {\n  border-color: var(--ink-soft);\n}\n\n.switch-track {\n  position: relative;\n  flex: none;\n }\n\n.node:hover {\n  border-color: var(--ink-soft);\n}\n\n.node[data-state=\"live\"] {\n  border-color: var(--live);\n  background: var(--live);\n  color: var(--on-live);\n}\n\n.node[data-state=\"live\"]:hover {\n  border-color: var(--live-tint);\n}\n\n.node[data-state=\"partial\"] {\n  border-style: dashed;\n  border-color: var(--partial);\n  background: var(--bg-raised);\n  color: var(--partial);\n}\n\n.node[aria-pressed=\"true\"] {\n  box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink);\n}\n\n.node:focus-visible {\n  outline-offset: 7px;\n}\n\n.node-num {\n  position: relative;\n}\n\n.node-halo {\n  position: absolute;\n  inset: -2px;\n  border: 2px solid var(--live);\n  border-radius: 50%;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.node[data-state=\"partial\"] .node-halo {\n  border-color: var(--partial);\n}\n\n.node-label {\n  position: absolute;\n  top: calc(100% + 6px);\n  left: 50%;\n  display: inline-flex;\n  align-items: center;\n  gap: 0.4em;\n  padding: 0.22em 0.62em;\n  border: 1px solid var(--rule);\n  border-radius: 999px;\n  background: var(--bg-sunk);\n  color: var(--ink-soft);\n  font-family: var(--font-body);\n  font-size: 0.72rem;\n  font-size: clamp(0.68rem, 2.4cqi, 0.82rem);\n  font-weight: 600;\n  line-height: 1.2;\n  white-space: nowrap;\n  transform: translateX(-50%);\n}\n\n.node[aria-pressed=\"true\"] .node-label {\n  border-color: var(--rule-strong);\n  color: var(--ink);\n}\n\n/* Owner glyphs and status swatches */\n\n.glyph {\n  display: inline-block;\n  flex: none;\n  width: 0.6em;\n  height: 0.6em;\n  background: currentColor;\n}\n\n.glyph-circle {\n  border-radius: 50%;\n}\n\n.glyph-square {\n  border-radius: 1px;\n}\n\n.glyph-diamond {\n  width: 0.5em;\n  height: 0.5em;\n  margin-inline: 0.05em;\n  transform: rotate(45deg);\n}\n\n.legends {\n  display: grid;\n  justify-items: center;\n  gap: 10px;\n}\n\n.legend {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 8px 18px;\n  margin: 0;\n  padding: 0;\n x solid var(--rule);\n}\n\n@media (min-width: 560px) {\n  .facts > div {\n    grid-template-columns: minmax(0, 10rem) minmax(0, 1fr);\n    gap: 16px;\n  }\n}\n\n.facts dt {\n  padding-top: 0.15em;\n  font-family: var(--font-display);\n  font-size: 0.74rem;\n  font-weight: 600;\n  line-height: 1.5;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.facts dd {\n  margin: 0;\n  color: var(--ink-soft);\n}\n\n.facts.mono dd {\n  font-family: var(--font-mono);\n  font-size: 0.84rem;\n  line-height: 1.55;\n}\n\n.tech-block {\n  padding: 14px 16px 6px;\n  border: 1px solid var(--rule);\n  border-radius: 14px;\n  background: var(--bg-sunk);\n}\n\n.tech-heading {\n  padding-bottom: 8px;\n  font-family: var(--font-mono);\n  font-size: 0.72rem;\n  font-weight: 500;\n  line-height: 1.3;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--live);\n}\n\n.step-nav {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: space-between;\n  gap: 10px;\n  padding-top: 14px;\n  border-top: 1px solid var(--rule);\n}\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-self: start;\n  gap: 0.5em;\n  padding: 0.7em 1.2em;\n  border: 1px solid var(--live);\n  border-radius: 999px;\n  background: var(--live);\n  color: var(--on-live);\n  font-size: 0.95rem;\n  font-weight: 600;\n  line-height: 1.2;\n  cursor: pointer;\n  transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;\n}\n\n.btn:hover {\n  border-color: var(--live-tint);\n  background: var(--live-tint);\n}\n\n.btn-quiet {\n  border-color: var(--rule-strong);\n  background: transparent;\n  color: var(--ink);\n}\n\n.btn-quiet:hover {\n  border-color: var(--ink);\n  background: transparent;\n}\n\n/* Rollout line score */\n\n.rollout {\n  display: grid;\n  gap: 20px;\n  min-width: 0;\n  padding: clamp(16px, 3vw, 30px);\n  border: 1px solid var(--rule);\n  border-radius: 20px;\n  background: var(--bg-sunk);\n}\n\n.section-head {\n  display: grid;\n  gap: 6px;\n}\n\n.section-head h2 {\n  font-size: clamp(1.45rem, 1.2rem + 1.1vw, 1.95rem);\n  font-weight: 700;\n  line-height: 1.1;\n  letter-spacing: 0.02em;\n  text-transform: uppercase;\n}\n\n.section-sub {\n  color: var(--muted);\n}\n\n.line-caption,\n.phase-new-title {\n  font-family: var(--font-display);\n  font-size: 0.74rem;\n  font-weight: 600;\n  line-height: 1.3;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.line-score {\n  display: grid;\n  gap: 10px;\n}\n\n.phase-list {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 6px;\n}\n\n@media (min-width: 640px) {\n  .phase-list {\n    grid-template-columns: repeat(6, minmax(0, 1fr));\n  }\n}\n\n.phase-stop {\n  display: grid;\n  align-content: start;\n  justify-items: center;\n  gap: 0.5rem;\n  min-width: 0;\n  padding: 0.75rem 0.35rem 0.85rem;\n  border: 1px solid var(--rule);\n  border-radius: 10px;\n  background: var(--bg-raised);\n  color: var(--ink);\n  cursor: pointer;\n  transition: border-color 0.2s ease, box-shadow 0.2s ease;\n}\n\n.phase-stop:hover {\n  border-color: var(--rule-strong);\n}\n\n.phase-stop[aria-checked=\"true\"] {\n  border-color: var(--live);\n  box-shadow: inset 0 0 0 1px var(--live);\n}\n\n.stop-badge {\n  padding: 0.3em 0.6em;\n  border-radius: 4px;\n  background: var(--bg-sunk);\n  font-family: var(--font-display);\n  font-size: 0.75rem;\n  font-weight: 700;\n  line-height: 1;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.phase-stop[aria-checked=\"true\"] .stop-badge {\n  background: var(--live);\n  color: var(--on-live);\n}\n\n.stop-score {\n  font-family: var(--font-display);\n  font-size: clamp(1.7rem, 1.3rem + 1.8vw, 2.6rem);\n  font-weight: 800;\n  line-height: 1;\n  font-variant-numeric: tabular-nums;\n}\n\n.stop-dots {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 3px;\n  max-width: 100%;\n}\n\n.dot {\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background: var(--off);\n}\n\n.dot[data-state=\"live\"] {\n  background: var(--live);\n}\n\n.dot[data-state=\"partial\"] {\n  background: transparent;\n  box-shadow: inset 0 0 0 1.5px var(--partial);\n}\n\n.stop-name {\n  font-size: 0.8rem;\n  font-weight: 500;\n  line-height: 1.25;\n  text-align: center;\n  text-wrap: balance;\n  color: var(--ink-soft);\n}\n\n.phase-detail {\n  display: grid;\n  gap: 18px;\n  padding-top: 18px;\n  border-top: 1px solid var(--rule);\n}\n\n@media (min-width: 960px) {\n  body.tech .phase-detail {\n    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);\n    gap: 32px;\n  }\n}\n\n.phase-copy {\n  display: grid;\n  align-content: start;\n  gap: 10px;\n}\n\n.phase-title {\n  font-size: clamp(1.25rem, 1.1rem + 0.8vw, 1.6rem);\n  font-weight: 700;\n  line-height: 1.15;\n}\n\n.phase-plain {\n  max-width: 62ch;\n  color: var(--ink-soft);\n}\n\n.phase-new {\n  display: grid;\n  gap: 8px;\n  margin-top: 4px;\n}\n\n.chip-list {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 6px;\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n\n/* Open decisions */\n\n.decisions {\n  display: grid;\n  gap: 18px;\n  min-width: 0;\n}\n\n.decision-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(min(100%, 12.5rem), 1fr));\n  gap: 12px;\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n\n.decision {\n  display: grid;\n  align-content: start;\n  gap: 0.55rem;\n  padding: 18px;\n  border: 1px solid var(--rule);\n  border-radius: 14px;\n  background: var(--bg-raised);\n}\n\n.decision-num {\n  font-family: var(--font-display);\n  font-size: 1.6rem;\n  font-weight: 800;\n  line-height: 1;\n}\n\n.decision h3 {\n  font-size: 1.1rem;\n  font-weight: 700;\n  line-height: 1.25;\n}\n\n.decision p {\n  color: var(--ink-soft);\n}\n\n.decision .decision-num {\n  color: var(--live);\n}\n\n.decision-tech {\n  padding-top: 0.6rem;\n  border-top: 1px solid var(--rule);\n  font-family: var(--font-mono);\n  font-size: 0.82rem;\n  line-height: 1.5;\n}\n\n.foot {\n  max-width: 70ch;\n  padding-top: 18px;\n  border-top: 1px solid var(--rule);\n  font-size: 0.88rem;\n  color: var(--muted);\n}\n\n/* Motion: the base styles above are the end state. */\n\n@media (prefers-reduced-motion: no-preference) {\n  .reveal {\n    animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;\n    animation-delay: calc(var(--i, 0) * 80ms);\n  }\n}\n\n@keyframes rise {\n  from {\n    opacity: 0;\n    transform: translateY(12px);\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *,\n  *::before,\n  *::after {\n    transition: none !important;\n    animation: none !important;\n  }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  \n  <div class=\"page\">\n    <header class=\"masthead reveal\" data-screen-label=\"Header\" style=\"--i: 0\">\n      <div class=\"masthead-copy\">\n        <p class=\"kicker\">Pelotero · On-device vision<\u002Fp>\n        <h1>The learning loop<\u002Fh1>\n        <p class=\"lede\">How the phone will learn to check a drill's setup before recording, and get better every time a coach corrects it.<\u002Fp>\n      <\u002Fdiv>\n      <button id=\"tech-switch\" class=\"switch\" type=\"button\" role=\"switch\" aria-checked=\"false\">\n        <span class=\"switch-track\" aria-hidden=\"true\"><span class=\"switch-thumb\"><\u002Fspan><\u002Fspan>\n        <span class=\"switch-label\">Technical detail<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fheader>\n\n    <main class=\"board\">\n      <section class=\"stage reveal\" data-screen-label=\"Loop\" aria-labelledby=\"loop-title\" style=\"--i: 1\">\n        <h2 id=\"loop-title\" class=\"visually-hidden\">The loop, step by step<\u002Fh2>\n        <div id=\"ring\" class=\"ring\">\n          <svg class=\"ring-svg\" viewBox=\"0 0 100 100\" aria-hidden=\"true\" focusable=\"false\">\n            <circle class=\"ring-face\" cx=\"50\" cy=\"50\" r=\"30\"><\u002Fcircle>\n            <circle class=\"ring-track\" cx=\"50\" cy=\"50\" r=\"40\"><\u002Fcircle>\n            <g id=\"ring-segments\"><\u002Fg>\n            <circle id=\"ring-token\" class=\"ring-token\" cx=\"50\" cy=\"10\" r=\"1.6\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div class=\"ring-centre\">\n            <p id=\"ring-phase\" class=\"ring-phase\">By phase 5<\u002Fp>\n            <p class=\"score\"><span id=\"ring-count\">7<\u002Fspan><small>/7<\u002Fsmall><\u002Fp>\n            <p class=\"score-caption\">steps working<\u002Fp>\n            <p id=\"ring-partial\" class=\"ring-partial\"><\u002Fp>\n          <\u002Fdiv>\n          <div id=\"ring-nodes\" class=\"ring-nodes\" role=\"group\" aria-label=\"Steps in the loop\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"legends\">\n          <ul class=\"legend\" aria-label=\"Status key\">\n            <li><span class=\"swatch swatch-live\" aria-hidden=\"true\"><\u002Fspan>Working<\u002Fli>\n            <li><span class=\"swatch swatch-partial\" aria-hidden=\"true\"><\u002Fspan>Partly working<\u002Fli>\n            <li><span class=\"swatch\" aria-hidden=\"true\"><\u002Fspan>Not yet<\u002Fli>\n          <\u002Ful>\n          <ul class=\"legend\" aria-label=\"Who runs each step\">\n            <li><span class=\"glyph glyph-circle\" aria-hidden=\"true\"><\u002Fspan>iOS app (Shahin)<\u002Fli>\n            <li><span class=\"glyph glyph-square\" aria-hidden=\"true\"><\u002Fspan>Server CV stack (Adam)<\u002Fli>\n            <li><span class=\"glyph glyph-diamond\" aria-hidden=\"true\"><\u002Fspan>Field Test R&amp;D (Bobby)<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <aside id=\"panel\" class=\"panel reveal\" data-screen-label=\"Step detail\" aria-live=\"polite\" aria-label=\"Step detail\" style=\"--i: 2\">\n        <div id=\"panel-overview\" class=\"panel-view\">\n          <p class=\"eyebrow\">How it works<\u002Fp>\n          <h2 class=\"panel-title\">Seven steps, one loop<\u002Fh2>\n          <p class=\"panel-lead\">The phone checks the setup before each recording. The coach confirms or corrects it. Those corrections travel home, show where the phone went wrong, and teach the next version, which rolls back out to phones. Pick any step on the loop to see who runs it.<\u002Fp>\n          <button id=\"start-walk\" class=\"btn\" type=\"button\">Walk through the steps<\u002Fbutton>\n          <h3 class=\"sub\">Three numbers tell us it’s working<\u002Fh3>\n          <ol class=\"measures\" role=\"list\">\n            <li>\n              <p class=\"measure-name\">How often coaches correct the phone<\u002Fp>\n              <p class=\"measure-note\">Should fall with every new version.<\u002Fp>\n              <p class=\"measure-tech tech-only\">Override rate: auto-ticks the coach reverses, plus manual ticks against a negative verdict, per model version and item.<\u002Fp>\n            <\u002Fli>\n            <li>\n              <p class=\"measure-name\">How often the phone says “ready” when the setup was wrong<\u002Fp>\n              <p class=\"measure-note\">Matters most, because nobody notices it at the time.<\u002Fp>\n              <p class=\"measure-tech tech-only\">False-tick rate: auto-ticked setups that later needed manual cone placement or were rejected for a setup reason.<\u002Fp>\n            <\u002Fli>\n            <li>\n              <p class=\"measure-name\">How often a capture has to be redone<\u002Fp>\n              <p class=\"measure-note\">The number the business feels; measured before the phone starts ticking.<\u002Fp>\n              <p class=\"measure-tech tech-only\">Re-capture rate: captures redone or rejected for setup reasons; baselined before CV-2 ships.<\u002Fp>\n            <\u002Fli>\n          <\u002Fol>\n          <p class=\"promo-rule tech-only\"><span class=\"mono-tag\">Promotion rule<\u002Fspan>A model advances a rollout step only if its override and false-tick rates are no worse than the active model's at the same step, over an agreed minimum number of check-runs.<\u002Fp>\n        <\u002Fdiv>\n\n        <div id=\"panel-node\" class=\"panel-view\" hidden=\"\">\n          <button id=\"panel-back\" class=\"link-btn\" type=\"button\">← Back to overview<\u002Fbutton>\n          <p class=\"eyebrow node-eyebrow\"><span id=\"node-num\"><\u002Fspan><span id=\"node-owner\" class=\"owner-chip\"><\u002Fspan><\u002Fp>\n          <h2 id=\"node-title\" class=\"panel-title\"><\u002Fh2>\n          <p id=\"node-status\" class=\"node-status\"><\u002Fp>\n          <p id=\"node-what\" class=\"panel-lead\"><\u002Fp>\n          <dl class=\"facts\">\n            <div><dt>Takes in<\u002Fdt><dd id=\"node-inputs\"><\u002Fdd><\u002Fdiv>\n            <div><dt>Hands on<\u002Fdt><dd id=\"node-outputs\"><\u002Fdd><\u002Fdiv>\n            <div><dt>How often<\u002Fdt><dd id=\"node-cadence\"><\u002Fdd><\u002Fdiv>\n            <div><dt>How we know it works<\u002Fdt><dd id=\"node-metric\"><\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n          <div class=\"tech-block tech-only\">\n            <p class=\"tech-heading\">Technical detail<\u002Fp>\n            <dl class=\"facts mono\">\n              <div><dt>Inputs<\u002Fdt><dd id=\"tech-inputs\"><\u002Fdd><\u002Fdiv>\n              <div><dt>Outputs<\u002Fdt><dd id=\"tech-outputs\"><\u002Fdd><\u002Fdiv>\n              <div><dt>Format<\u002Fdt><dd id=\"tech-format\"><\u002Fdd><\u002Fdiv>\n              <div><dt>Metric<\u002Fdt><dd id=\"tech-metric\"><\u002Fdd><\u002Fdiv>\n              <div><dt>Notes<\u002Fdt><dd id=\"tech-extra\"><\u002Fdd><\u002Fdiv>\n            <\u002Fdl>\n          <\u002Fdiv>\n          <nav class=\"step-nav\" aria-label=\"Step by step\">\n            <button id=\"node-prev\" class=\"btn btn-quiet\" type=\"button\"><span aria-hidden=\"true\">←<\u002Fspan><span id=\"node-prev-label\">Previous<\u002Fspan><\u002Fbutton>\n            <button id=\"node-next\" class=\"btn btn-quiet\" type=\"button\"><span id=\"node-next-label\">Next<\u002Fspan><span aria-hidden=\"true\">→<\u002Fspan><\u002Fbutton>\n          <\u002Fnav>\n        <\u002Fdiv>\n      <\u002Faside>\n\n      <section class=\"rollout reveal\" data-screen-label=\"Rollout\" aria-labelledby=\"rollout-title\" style=\"--i: 3\">\n        <div class=\"section-head\">\n          <h2 id=\"rollout-title\">Rollout<\u002Fh2>\n          <p class=\"section-sub\">Pick a phase to see which parts of the loop work by then.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"line-score\">\n          <p class=\"line-caption\" aria-hidden=\"true\">Steps working at each phase<\u002Fp>\n          <div id=\"phase-list\" class=\"phase-list\" role=\"radiogroup\" aria-labelledby=\"rollout-title\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"phase-detail\" class=\"phase-detail\" aria-live=\"polite\">\n          <div class=\"phase-copy\">\n            <p class=\"eyebrow\"><span id=\"phase-code\" class=\"mono-tag tech-only\"><\u002Fspan><span id=\"phase-kicker\"><\u002Fspan><\u002Fp>\n            <h3 id=\"phase-title\" class=\"phase-title\"><\u002Fh3>\n            <p id=\"phase-plain\" class=\"phase-plain\"><\u002Fp>\n            <div id=\"phase-new\" class=\"phase-new\"><\u002Fdiv>\n          <\u002Fdiv>\n          <dl class=\"facts mono tech-only\">\n            <div><dt>Deliverables<\u002Fdt><dd id=\"phase-deliverables\"><\u002Fdd><\u002Fdiv>\n            <div><dt>Exit criteria<\u002Fdt><dd id=\"phase-exit\"><\u002Fdd><\u002Fdiv>\n            <div><dt>Size<\u002Fdt><dd id=\"phase-size\"><\u002Fdd><\u002Fdiv>\n            <div><dt>Depends on<\u002Fdt><dd id=\"phase-depends\"><\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"decisions reveal\" data-screen-label=\"Open decisions\" aria-labelledby=\"decisions-title\" style=\"--i: 4\">\n        <div class=\"section-head\">\n          <h2 id=\"decisions-title\">Still to decide<\u002Fh2>\n          <p class=\"section-sub\">Five choices that shape the later phases.<\u002Fp>\n        <\u002Fdiv>\n        <ol class=\"decision-grid\" role=\"list\">\n          <li class=\"decision\">\n            <p class=\"decision-num\" aria-hidden=\"true\">1<\u002Fp>\n            <h3>Model licence<\u002Fh3>\n            <p>Whether we pay for a licence for the current cone-spotting model, or train our own, before it ships inside the app.<\u002Fp>\n            <p class=\"decision-tech tech-only\">AGPL-3.0 on the bundled YOLO export: commercial licence or a permissive retrain. The colour-threshold baseline is unaffected.<\u002Fp>\n          <\u002Fli>\n          <li class=\"decision\">\n            <p class=\"decision-num\" aria-hidden=\"true\">2<\u002Fp>\n            <h3>Guide or gate<\u002Fh3>\n            <p>Whether the checklist only advises the coach, or can hold recording until the setup is right.<\u002Fp>\n            <p class=\"decision-tech tech-only\">Lock vs override: soft warnings, a per-item lock with a recorded one-tap override, or a hard lock. The default here is auto-tick with override.<\u002Fp>\n          <\u002Fli>\n          <li class=\"decision\">\n            <p class=\"decision-num\" aria-hidden=\"true\">3<\u002Fp>\n            <h3>Event day or every day<\u002Fh3>\n            <p>Whether event days get a stricter version of the checks than everyday sessions.<\u002Fp>\n            <p class=\"decision-tech tech-only\">URS event-day mode vs the everyday checklist.<\u002Fp>\n          <\u002Fli>\n          <li class=\"decision\">\n            <p class=\"decision-num\" aria-hidden=\"true\">4<\u002Fp>\n            <h3>Learning from pictures<\u002Fh3>\n            <p>Whether still pictures of young athletes may help train the models, and whose permission that needs.<\u002Fp>\n            <p class=\"decision-tech tech-only\">Training consent for minors: numbers only, setup frames blurred on the phone, or images under recorded guardian consent.<\u002Fp>\n          <\u002Fli>\n          <li class=\"decision\">\n            <p class=\"decision-num\" aria-hidden=\"true\">5<\u002Fp>\n            <h3>Android<\u002Fh3>\n            <p>Whether an Android app is coming, which decides how models are built for both kinds of phone.<\u002Fp>\n            <p class=\"decision-tech tech-only\">Branch A: one PyTorch source exported to Core ML and LiteRT with parity checks. Branch B: Core ML and Vision only.<\u002Fp>\n          <\u002Fli>\n        <\u002Fol>\n      <\u002Fsection>\n    <\u002Fmain>\n\n    <footer class=\"foot\">\n      <p>Proposal, 2 October 2026. Owners are shown by role. Switch on Technical detail for file formats, sizes and the engineering specifics.<\u002Fp>\n    <\u002Ffooter>\n  <\u002Fdiv>\n  <script src=\"23162dd8-2ca5-4a41-b9fa-2320ca031b00\"><\u002Fscript>\n  <script src=\"5370a654-499c-4a40-aa4c-cf37df655b67\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
